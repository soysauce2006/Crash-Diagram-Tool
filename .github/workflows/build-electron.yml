name: Build Windows Installer (.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite app (Electron target)
        working-directory: artifacts/accident-diagram
        run: pnpm run build:electron

      - name: Package Electron app for Windows
        working-directory: artifacts/accident-diagram
        run: pnpm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: crash-diagram-windows-installer
          path: artifacts/accident-diagram/dist/electron-dist/*.exe
          if-no-files-found: error
          retention-days: 30
