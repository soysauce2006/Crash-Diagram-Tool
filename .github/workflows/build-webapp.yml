name: Build Web Server Package (.zip)

# Run on every push to main, or trigger manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-webapp:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node + pnpm ───────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # ── Install workspace deps ─────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build the Vite frontend ────────────────────────────────────────────
      - name: Build Vite app (webapp target)
        working-directory: artifacts/accident-diagram
        run: pnpm exec vite build --config vite.webapp.config.ts

      # ── Assemble the deployable package ───────────────────────────────────
      - name: Assemble package directory
        run: |
          mkdir -p dist/crash-diagram-webapp/public
          # Pre-built frontend
          cp -r artifacts/accident-diagram/dist/webapp/. dist/crash-diagram-webapp/public/
          # Server + config
          cp artifacts/accident-diagram/server.js          dist/crash-diagram-webapp/server.js
          cp artifacts/accident-diagram/webapp-package.json dist/crash-diagram-webapp/package.json
          cp artifacts/accident-diagram/webapp-README.md   dist/crash-diagram-webapp/README.md

      # ── Zip it ────────────────────────────────────────────────────────────
      - name: Create zip archive
        run: |
          cd dist
          zip -r crash-diagram-webapp.zip crash-diagram-webapp/
          echo "Package size: $(du -sh crash-diagram-webapp.zip | cut -f1)"

      # ── Upload artifact ────────────────────────────────────────────────────
      - name: Upload webapp package
        uses: actions/upload-artifact@v4
        with:
          name: crash-diagram-webapp
          path: dist/crash-diagram-webapp.zip
          if-no-files-found: error
          retention-days: 30
